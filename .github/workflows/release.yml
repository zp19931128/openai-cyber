name: Check and release CPR plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: rust:1.99.1-slim-bookworm@sha256:f2c004e3d2d8b547e8cf7ffbc29205385f4e71d23e53e4e383065db5e9f822cd
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Prepare tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 git ca-certificates
          rustup component add rustfmt clippy
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Validate version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path
          versions = [tomllib.loads(Path(p).read_text())['package']['version']
                      for p in ['Cargo.toml', 'plugin/Cargo.toml']]
          versions.append(json.loads(Path('plugin/plugin.json').read_text())['version'])
          assert len(set(versions)) == 1, 'Package versions must agree'
          tag = os.environ['RELEASE_TAG']
          assert not tag or tag == 'v' + versions[0], 'Tag must match the plugin version'
          PY
      - name: Check source and rules
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path plugin/Cargo.toml -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo clippy --manifest-path plugin/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Build Linux plugin and verify RPC
        run: |
          cargo build --manifest-path plugin/Cargo.toml --release --locked
          python3 scripts/verify-plugin.py plugin/target/release/cpr-keyword-guard-plugin
      - name: Build official packager
        run: |
          cargo install --git https://github.com/zyycn/codex-proxy-rs.git \
            --rev 5b7f307bb26a5d0221f1f59475bc049bb350c21a \
            --locked --root "$RUNNER_TEMP/cpr-tools" codex-proxy-plugin-cli
      - name: Package plugin
        run: |
          "$RUNNER_TEMP/cpr-tools/bin/cpr-plugin" package \
            --manifest plugin/plugin.json \
            --binary plugin/target/release/cpr-keyword-guard-plugin \
            --target x86_64-unknown-linux-gnu \
            --output-dir dist
          (cd dist && sha256sum -c ./*.sha256)
          cat dist/*.sha256 > dist/checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpr-keyword-guard-linux-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cpr-keyword-guard-linux-x86_64
          path: dist
      - name: Publish installable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "CPR Keyword Guard $RELEASE_TAG" \
            --notes 'Linux x86_64 CPR plugin. Includes Cyber, general abuse, and jailbreak keyword rules. Install the tar.gz attachment; source archives are not plugin packages. Compatibility: CPR 3.39.1–3.48.0, manifest v2 / RPC v7 / middleware v6.' \
            --latest
