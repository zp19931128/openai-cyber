[package]
name = "cpr-keyword-guard-plugin"
version = "0.3.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[dependencies]
cpr-keyword-guard = { path = ".." }
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "5b7f307bb26a5d0221f1f59475bc049bb350c21a", features = ["io"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["io-std", "macros", "rt", "sync", "time"] }

[profile.release]
strip = "symbols"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
