[package]
name = "cpr-keyword-guard"
version = "0.3.3"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "CPR 请求前关键词规则库"

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
